[package]
name = "Mutsumi"
version = "1.1.0"
description = "Mutsumi desktop companion"
authors = ["yOHO"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"               # native file-open picker (image attach)
tauri-plugin-clipboard-manager = "2"    # read pasted clipboard images
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff", "webp"] }  # silent local image compression (no HEIC)
base64 = "0.22"   # data-URL encoding for vision image payloads
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
dotenvy = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.20"   # HTML parsing for search-result + page-body scraping
regex = "1"        # date / keyword detection for search triggering
tokio = { version = "1", features = ["time", "macros"] }  # search budget + concurrent embed/search (join!)

# Test-only async runtime for the (ignored) live API smoke tests.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# ── Release size optimizations ─────────────────────────────────────
[profile.release]
opt-level     = "z"   # shrink over speed (vs "s": slightly larger but faster)
lto           = true  # whole-program dead-code elimination across all crates
codegen-units = 1     # single CGU — required for full LTO coverage
strip         = true  # drop DWARF debug symbols from the final binary
panic         = "abort" # no unwinding tables/machinery (~50 KB saved)

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # WinRT System Media Transport Controls — drives the mini music controller
    # (Spotify / browsers / 网易云音乐 / any SMTC-integrated player).
    "Media_Control",
    "Foundation",
] }
