[package]
name = "Mutsumi"
version = "1.5.3"
description = "Mutsumi desktop companion"
authors = ["yOHO"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `with_webview` exposes platform-native handles whose shape may change across
# Tauri minor releases; keep this adapter within the audited 2.11 line.
tauri = { version = "~2.11.2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"      # Ctrl+Alt+F toggles manual flying mode
tauri-plugin-dialog = "2"               # native file-open picker (image attach)
tauri-plugin-clipboard-manager = "2"    # read pasted clipboard images
tauri-plugin-opener = "2"               # open the "how to get a key" tutorial in the system browser
tauri-plugin-updater = "2"              # in-app auto-update (checks GitHub Releases latest.json)
tauri-plugin-process = "2"              # relaunch() after an update installs
# OS credential store for the user's Qwen/百炼 API key (Windows Credential
# Manager / macOS Keychain / Linux Secret Service) — never plaintext on disk.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff", "webp"] }  # silent local image compression (no HEIC)
base64 = "0.22"   # data-URL encoding for vision image payloads
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
dotenvy = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.20"   # HTML parsing for search-result + page-body scraping
regex = "1"        # date / keyword detection for search triggering
tokio = { version = "1", features = ["time", "macros", "sync"] }  # search budget + concurrent embed/search (join!) + webview-serp oneshot/Mutex
sysinfo = "0.36.1"   # CPU / memory / network sampling for the System State panel
battery = "0.7.8"    # battery level + charge-rate time estimate

# Test-only async runtime for the (ignored) live API smoke tests.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Exercise the same LaunchAgent backend used transitively by
# tauri-plugin-autostart without requiring a Tauri window in the live smoke.
auto-launch = "0.5"

# ── Release size optimizations ─────────────────────────────────────
[profile.release]
opt-level     = "z"   # shrink over speed (vs "s": slightly larger but faster)
lto           = true  # whole-program dead-code elimination across all crates
codegen-units = 1     # single CGU — required for full LTO coverage
strip         = true  # drop DWARF debug symbols from the final binary
panic         = "abort" # no unwinding tables/machinery (~50 KB saved)

[target.'cfg(windows)'.dependencies]
# Read a fetched page's rendered HTML from the Rust side via
# ICoreWebView2::ExecuteScript (search "go deeper" step) — result pages get no
# Tauri IPC surface, unlike the SERP emit path. Same version wry pins.
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # WinRT System Media Transport Controls — drives the mini music controller
    # (Spotify / browsers / 网易云音乐 / any SMTC-integrated player).
    "Media_Control",
    "Foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Pull rendered result-page HTML from WKWebView through Apple's public
# evaluateJavaScript completion callback. These versions match Tauri/Wry's
# audited native-webview dependency line.
block2 = "0.6"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSError", "NSJSONSerialization", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKWebView"] }
# Public AppKit NSWindow::setFrame:display: for atomic pet-window geometry.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow"] }
# Parse the structured XML property lists emitted by macOS diskutil.
plist = "1.10"
