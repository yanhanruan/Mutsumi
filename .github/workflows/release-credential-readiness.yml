# Non-mutating credential check for the signed release pipeline. This workflow
# proves that the updater key, Developer ID identity and App Store Connect API
# credentials work without creating a release, tag, artifact or notarization
# submission.
name: release-credential-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-credential-readiness
  cancel-in-progress: false

jobs:
  preflight:
    name: Release secret structural preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify required updater and Apple secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: bash scripts/verify-release-secrets.sh

  macos:
    name: Prove updater and Apple credential readiness
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install signing verifier dependencies
        run: npm ci

      - name: Prove updater private key matches the committed public key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/verify-updater-signing-key.sh

      - name: Import Developer ID and App Store Connect credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: bash scripts/setup-macos-signing.sh

      - name: Prove Developer ID signing and read-only notary authentication
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bash scripts/verify-macos-release-credentials.sh

      - name: Remove ephemeral macOS signing material
        if: always()
        shell: bash
        run: bash scripts/cleanup-macos-signing.sh
